[versions]
# Kotlin
kotlin = "2.1.20"
kotlin-serialization = "2.1.20"

# Logging
log4j = "2.25.3"
slf4j = "2.0.17"

# Configurate
configurate = "4.2.0"

# Plugins
foojay-resolver = "1.0.0"
shadow = "9.3.1"

# Other dependencies
kotlinx-coroutines = "1.10.2"
kotlinx-serialization-json = "1.8.1"
clikt = "5.0.3"
jnats = "2.25.1"
adventure = "4.26.1"
okhttp = "5.3.2"
cloud-api = "0.1.0-platform.17-dev.1770509030341-a76654a"
commons-io = "2.21.0"
gson = "2.13.2"
postgre = "42.7.9"
caffeine = "3.2.3"

# JOOQ
jooq = "3.20.11"

# Proto Buf
protobuf = "4.33.5"
grpc = "1.79.0"
grpc-kotlin = "1.5.0"

# Ktor
ktor = "3.2.2"

[libraries]
# Kotlin
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Logging
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-slf4j-impl = { module = "org.apache.logging.log4j:log4j-slf4j-impl", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Configurate
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-gson = { module = "org.spongepowered:configurate-gson", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }

# Other dependencies
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
postgre-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgre" }
cloud-api = { module = "app.simplecloud.api:api", version.ref = "cloud-api" }

# Adventure
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }

# JOOQ
jooq = { module = "org.jooq:jooq-kotlin", version.ref = "jooq" }
jooq-meta = { module = "org.jooq:jooq-meta", version.ref = "jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
jooq-kotlin-coroutines = { module = "org.jooq:jooq-kotlin-coroutines", version.ref = "jooq" }

# Ktor
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Proto Buf
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }

grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }

[bundles]
logging = ["log4j-core", "log4j-api", "log4j-slf4j-impl", "slf4j-api"]
adventure = ["adventure-text-serializer-gson", "adventure-api"]
configurate = ["configurate-yaml", "configurate-gson", "configurate-extra-kotlin"]
jooq = ["jooq-kotlin-coroutines", "jooq", "jooq-meta-extensions", "jooq-meta"]
ktor-server = ["ktor-serialization-kotlinx-json", "ktor-server-netty", "ktor-server-content-negotiation", "ktor-server-core", "ktor-server-cors", "ktor-server-websockets"]
grpc = ["grpc-stub", "grpc-netty-shaded", "grpc-kotlin-stub", "grpc-protobuf", "protobuf-kotlin"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-serialization" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
